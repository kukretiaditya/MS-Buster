<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Schematic: two adjacent charge-state peaks give the charge state and then the neutral mass" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fb923c"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="260" rx="16" fill="#0d1426"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">

    <!-- Left panel: averaged spectrum with an adjacent pair highlighted -->
    <rect x="20" y="20" width="450" height="220" rx="12" fill="#111b36"/>
    <text x="40" y="44" font-size="14" font-weight="700" fill="#e2e8f0">Averaged spectrum: charge-state series</text>
    <line x1="40" y1="200" x2="450" y2="200" stroke="#475569" stroke-width="1.5"/>
    <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round">
      <line x1="70"  y1="200" x2="70"  y2="184"/>
      <line x1="108" y1="200" x2="108" y2="164"/>
      <line x1="146" y1="200" x2="146" y2="128"/>
      <line x1="260" y1="200" x2="260" y2="92"/>
      <line x1="298" y1="200" x2="298" y2="130"/>
      <line x1="336" y1="200" x2="336" y2="162"/>
      <line x1="374" y1="200" x2="374" y2="180"/>
      <line x1="412" y1="200" x2="412" y2="190"/>
    </g>
    <g stroke="#4ade80" stroke-width="5" stroke-linecap="round">
      <line x1="184" y1="200" x2="184" y2="90"/>
      <line x1="222" y1="200" x2="222" y2="76"/>
    </g>
    <path d="M184,70 V66 H222 V70" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="203" y="60" font-size="11" fill="#4ade80" text-anchor="middle">adjacent pair, one charge apart</text>
    <g font-size="10" fill="#94a3b8" text-anchor="middle">
      <text x="70" y="216">z+6</text><text x="108" y="216">z+5</text><text x="146" y="216">z+4</text>
      <text x="184" y="216" fill="#4ade80" font-weight="700">z+1</text><text x="222" y="216" fill="#4ade80" font-weight="700">z</text>
      <text x="260" y="216">z-1</text><text x="298" y="216">z-2</text><text x="336" y="216">z-3</text>
      <text x="374" y="216">z-4</text><text x="412" y="216">z-5</text>
    </g>
    <text x="450" y="233" font-size="11" fill="#64748b" text-anchor="end">m/z</text>

    <!-- Middle arrow -->
    <line x1="485" y1="125" x2="565" y2="125" stroke="#fb923c" stroke-width="3" marker-end="url(#arrO)"/>
    <text x="525" y="108" font-size="14" font-weight="700" fill="#fb923c" text-anchor="middle">MS-Buster</text>
    <text x="525" y="148" font-size="12" fill="#94a3b8" text-anchor="middle">mass from pairs</text>

    <!-- Right panel: three-step logic -->
    <rect x="580" y="20" width="400" height="220" rx="12" fill="#111b36"/>
    <text x="600" y="44" font-size="14" font-weight="700" fill="#e2e8f0">From two peaks to a mass</text>

    <g fill="#162040" stroke="#334155" stroke-width="1.2">
      <rect x="610" y="62" width="340" height="38" rx="8"/>
      <rect x="610" y="116" width="340" height="38" rx="8"/>
      <rect x="610" y="170" width="340" height="38" rx="8"/>
    </g>
    <g fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">
      <circle cx="633" cy="81" r="11" fill="#052e16" stroke="#4ade80"/><text x="633" y="86">1</text>
      <circle cx="633" cy="135" r="11" fill="#052e16" stroke="#4ade80"/><text x="633" y="140">2</text>
      <circle cx="633" cy="189" r="11" fill="#052e16" stroke="#4ade80"/><text x="633" y="194">3</text>
    </g>
    <g fill="#e2e8f0" font-size="13">
      <text x="656" y="86">Two adjacent peaks, one charge apart</text>
      <text x="656" y="140">Their m/z difference gives the charge z</text>
      <text x="656" y="194">m/z and z give the neutral mass M</text>
    </g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrG)">
      <line x1="780" y1="102" x2="780" y2="113"/>
      <line x1="780" y1="156" x2="780" y2="167"/>
    </g>
    <text x="780" y="229" font-size="11" fill="#94a3b8" text-anchor="middle">Automatic mode repeats this for every adjacent pair</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
