<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="MS-Buster workflow: load data, plot chromatogram, select retention-time window, average spectra, deconvolve to intact mass" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="200" rx="16" fill="#0d1426"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="100" y="32" font-size="11" letter-spacing="2" fill="#22d3ee">STEP 1</text>
    <text x="300" y="32" font-size="11" letter-spacing="2" fill="#a78bfa">STEP 2</text>
    <text x="500" y="32" font-size="11" letter-spacing="2" fill="#fb923c">STEP 3</text>
    <text x="700" y="32" font-size="11" letter-spacing="2" fill="#f472b6">STEP 4</text>
    <text x="900" y="32" font-size="11" letter-spacing="2" fill="#4ade80">STEP 5</text>

    <rect x="20"  y="45" width="160" height="120" rx="12" fill="#111b36" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="220" y="45" width="160" height="120" rx="12" fill="#111b36" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="420" y="45" width="160" height="120" rx="12" fill="#111b36" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="620" y="45" width="160" height="120" rx="12" fill="#111b36" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="820" y="45" width="160" height="120" rx="12" fill="#111b36" stroke="#4ade80" stroke-width="1.5"/>

    <g stroke="#64748b" stroke-width="2" marker-end="url(#arr)">
      <line x1="186" y1="105" x2="214" y2="105"/>
      <line x1="386" y1="105" x2="414" y2="105"/>
      <line x1="586" y1="105" x2="614" y2="105"/>
      <line x1="786" y1="105" x2="814" y2="105"/>
    </g>

    <!-- Glyph 1: data folder -->
    <path d="M72,68 H90 L96,74 H128 V98 H72 Z" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Glyph 2: chromatogram -->
    <path d="M260,95 L278,95 C286,95 286,62 295,62 C304,62 304,95 314,95 L322,95 C327,95 327,80 332,80 C337,80 337,95 342,95 L346,95" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <!-- Glyph 3: chromatogram with selected window -->
    <rect x="474" y="56" width="44" height="42" rx="3" fill="#fb923c" fill-opacity=".2" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M460,95 L478,95 C486,95 486,62 495,62 C504,62 504,95 514,95 L540,95" fill="none" stroke="#fb923c" stroke-width="2.5"/>
    <!-- Glyph 4: averaged spectrum -->
    <g stroke="#f472b6" stroke-width="3" stroke-linecap="round">
      <line x1="670" y1="95" x2="670" y2="85"/><line x1="680" y1="95" x2="680" y2="75"/>
      <line x1="690" y1="95" x2="690" y2="62"/><line x1="700" y1="95" x2="700" y2="56"/>
      <line x1="710" y1="95" x2="710" y2="64"/><line x1="720" y1="95" x2="720" y2="76"/>
      <line x1="730" y1="95" x2="730" y2="88"/>
    </g>
    <!-- Glyph 5: two adjacent peaks to a mass -->
    <g stroke="#4ade80" stroke-width="3" stroke-linecap="round">
      <line x1="871" y1="95" x2="871" y2="68"/><line x1="883" y1="95" x2="883" y2="58"/>
    </g>
    <line x1="895" y1="80" x2="913" y2="80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
    <line x1="929" y1="95" x2="929" y2="55" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>

    <g fill="#e2e8f0" font-size="15" font-weight="700">
      <text x="100" y="128">Load data</text>
      <text x="300" y="128">Chromatogram</text>
      <text x="500" y="128">Select a peak</text>
      <text x="700" y="128">Average spectra</text>
      <text x="900" y="128">Deconvolve</text>
    </g>
    <g fill="#94a3b8" font-size="11.5">
      <text x="100" y="148">Agilent .d, mzML, text</text>
      <text x="300" y="148">intensity vs. time</text>
      <text x="500" y="148">choose the RT window</text>
      <text x="700" y="148">all scans in the window</text>
      <text x="900" y="148">mass saved as text file</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
